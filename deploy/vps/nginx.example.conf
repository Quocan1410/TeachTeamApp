# /etc/nginx/sites-available/teachteamapp
# Replace yourdomain.com. Requires PM2 apps on 127.0.0.1:3000,3001,5000,4002.

upstream teachteam_web {
    server 127.0.0.1:3000;
}

upstream teachteam_admin_web {
    server 127.0.0.1:3001;
}

upstream teachteam_api {
    server 127.0.0.1:5000;
}

upstream teachteam_admin_api {
    server 127.0.0.1:4002;
}

# Main app (candidates + lecturers)
server {
    listen 80;
    server_name app.yourdomain.com;

    location / {
        proxy_pass http://teachteam_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# REST + Socket.IO
server {
    listen 80;
    server_name api.yourdomain.com;

    location /socket.io/ {
        proxy_pass http://teachteam_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://teachteam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin dashboard
server {
    listen 80;
    server_name admin.yourdomain.com;

    location / {
        proxy_pass http://teachteam_admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin GraphQL (+ WebSocket)
server {
    listen 80;
    server_name admin-api.yourdomain.com;

    location / {
        proxy_pass http://teachteam_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
